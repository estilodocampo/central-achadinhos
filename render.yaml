databases:
  - name: central-db
    plan: free
services:
  - type: web
    name: central-achadinhos
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm test
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        fromDatabase:
          name: central-db
          property: connectionString
